name: Build Windows

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build Windows binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          export CGO_ENABLED=0 GOOS=windows GOARCH=amd64
          for cmd in server login credit; do
            echo "::group::Building cmd/${cmd}"
            go build -trimpath -ldflags "-s -w" -o "dist/lobsterai-${cmd}.exe" "./cmd/${cmd}"
            echo "::endgroup::"
          done
          cp config.example.json dist/config.example.json
          (cd dist && zip -r lobsterai2api-windows-amd64.zip \
            lobsterai-server.exe lobsterai-login.exe lobsterai-credit.exe config.example.json)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lobsterai2api-windows-amd64
          path: |
            dist/lobsterai-server.exe
            dist/lobsterai-login.exe
            dist/lobsterai-credit.exe
            dist/config.example.json
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lobsterai2api-windows-amd64.zip
            dist/lobsterai-server.exe
            dist/lobsterai-login.exe
            dist/lobsterai-credit.exe
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
